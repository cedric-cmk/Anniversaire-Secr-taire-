<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyeux Anniversaire — NSIA Assurance Vie</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f0f4fa;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
      font-family: 'Lato', sans-serif;
    }

    .card-wrap {
      width: 100%;
      max-width: 560px;
    }

    .hero {
      background: linear-gradient(135deg, #002244 0%, #004488 60%, #0066bb 100%);
      border-radius: 20px 20px 0 0;
      padding: 2.5rem 2rem 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .nsia-badge {
      display: inline-block;
      background: rgba(255,200,0,0.15);
      border: 1px solid rgba(255,200,0,0.5);
      color: #ffc800;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    .avatar-circle {
      width: 140px; height: 140px;
      border-radius: 50%;
      background: rgba(255,200,0,0.15);
      border: 3px solid #ffc800;
      margin: 0 auto 0.9rem;
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2s ease-in-out infinite;
      overflow: hidden;
    }

    .photo-portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(255,200,0,0.4); }
      50% { box-shadow: 0 0 0 12px rgba(255,200,0,0); }
    }

    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      color: #fff;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 0.4rem;
    }
    .hero h1 span { color: #ffc800; }

    .hero .role {
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      font-weight: 300;
    }

    .date-chip {
      display: inline-block;
      margin-top: 0.8rem;
      background: #ffc800;
      color: #002244;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 16px;
      border-radius: 20px;
    }

    .body-card {
      background: #ffffff;
      border: 1px solid #dce6f5;
      border-top: none;
      border-radius: 0 0 20px 20px;
      padding: 1.6rem 1.5rem 2rem;
      box-shadow: 0 8px 32px rgba(0,34,68,0.08);
    }

    .salutation-box {
      background: linear-gradient(135deg, #004488, #0066bb);
      color: #ffc800;
      padding: 1rem 1.5rem;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.2rem;
    }

    .intro-text {
      font-size: 0.95rem;
      color: #444;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* SECTION DES 3 OPTIONS AGRANDIE */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 1.5rem;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 1.2rem 0.5rem;
      border-radius: 12px;
      border: 2px solid #004488;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
      min-height: 110px;
    }

    .action-btn:hover, .action-btn.active {
      background: #002244;
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0,34,68,0.2);
    }

    .action-btn .icon { 
      font-size: 28px; /* Plus grand */
    }

    .action-btn .label {
      font-size: 12px; /* Plus lisible */
      font-weight: 700;
      color: #004488;
      line-height: 1.2;
    }
    .action-btn:hover .label, .action-btn.active .label { color: #ffc800; }

    .panel {
      display: none;
      background: #f4f8ff;
      border: 1px solid #c5d8f0;
      border-radius: 12px;
      padding: 1.2rem;
      margin-bottom: 1.1rem;
    }
    .panel.show { display: block; }

    .panel label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #002244;
      margin-bottom: 5px;
      margin-top: 10px;
    }

    .panel input, .panel select, .panel textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #b0c8e8;
      border-radius: 8px;
      font-family: 'Lato', sans-serif;
    }

    .send-btn {
      margin-top: 15px;
      width: 100%;
      padding: 12px;
      background: #002244;
      color: #ffc800;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
    }

    .bonne-semaine-box {
      background: linear-gradient(135deg, #002244, #004488);
      border-radius: 14px;
      padding: 1.2rem;
      text-align: center;
      margin-top: 1rem;
      color: white;
    }
    .bsw-title { color: #ffc800; font-weight: 700; margin-bottom: 5px; }
    .bsw-sub { font-size: 12px; opacity: 0.8; }
  </style>
</head>
<body>

  <div class="card-wrap">
    <div class="hero">
      <div class="nsia-badge">NSIA Assurance Vie</div>
      <div class="avatar-circle">
        <img src="secretaire.jpg" alt="Secrétaire" class="photo-portrait">
      </div>
      <h1>C'est mon<br><span>Anniversaire !</span></h1>
      <p class="role">Secrétaire NSIA Assurance Vie</p>
      <span class="date-chip">🎉 Dimanche 12 Avril</span>
    </div>

    <div class="body-card">
      <div class="salutation-box" id="salutation"></div>
      
      <div class="intro-text">
        <p>En ce jour spécial, je suis heureuse de partager cet instant avec vous.</p>
        <p><strong>Que souhaitez-vous faire ?</strong></p>
      </div>

      <div class="actions">
        <button class="action-btn" id="btn-voeux" onclick="toggle('voeux')">
          <span class="icon">🎂</span>
          <span class="label">Souhaiter joyeux anniversaire</span>
        </button>
        <button class="action-btn" id="btn-contrat" onclick="toggle('contrat')">
          <span class="icon">📋</span>
          <span class="label">Souscrire un contrat</span>
        </button>
        <button class="action-btn" id="btn-semaine" onclick="toggle('semaine')">
          <span class="icon">🌟</span>
          <span class="label">Lui souhaiter bonne semaine</span>
        </button>
      </div>

      <div class="panel" id="panel-voeux">
        <label>Votre Nom et Prénom</label>
        <input type="text" id="nom-voeux" placeholder="Ex : Marie">
        <label>Votre numéro</label>
        <input type="tel" id="tel-voeux" placeholder="Ex : +229 01... ">
        <label>Votre message</label>
        <textarea id="msg-voeux" placeholder="Joyeux anniversaire !"></textarea>
        <button class="send-btn" onclick="envoyer('voeux')">Envoyer mon message 🎂</button>
      </div>

      <div class="panel" id="panel-contrat">
        <label>Votre nom complet</label>
        <input type="text" id="nom-contrat" placeholder="Ex : Jean KOCOU">
        <label>Votre numéro</label>
        <input type="tel" id="tel-contrat" placeholder="Ex : +229 97... ">
        <label>Ma demande</label>
        <select id="offre-contrat">
          <option>Nouveau contrat d'assurance vie</option>
          <option>Complément sur contrat existant</option>
          <option>Informations offres NSIA</option>
        </select>
        <label>Précision</label>
        <textarea id="msg-contrat" placeholder="Décrivez votre besoin..."></textarea>
        <button class="send-btn" onclick="envoyer('contrat')">Envoyer ma demande 📋</button>
      </div>

      <div class="panel" id="panel-semaine">
        <label>Votre Nom et Prénom</label>
        <input type="text" id="nom-semaine" placeholder="Ex : Paul">
        <label>Votre numéro</label>
        <input type="tel" id="tel-semaine" placeholder="+229...">
        <label>Message</label>
        <textarea id="msg-semaine" placeholder="Bonne semaine !"></textarea>
        <button class="send-btn" onclick="envoyer('semaine')">Envoyer 🌟</button>
      </div>

      <div class="bonne-semaine-box">
        <div class="bsw-title">🌟 Bonne semaine productive !</div>
        <div class="bsw-sub">Je reste à votre écoute pour protéger votre avenir.</div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwg-2wEalPV9daRuPRoTn9R9k2ECx_p69KOCan84wTGGm_rgK5UmMhz-W0rKIp6fd52DA/exec";
    var actif = null;

    function getSalutation() {
      const h = new Date().getHours();
      if (h >= 6 && h < 12) return "☀️ Bonne matinée !";
      if (h >= 12 && h < 18) return "☀️ Bon après-midi !";
      if (h >= 18 && h < 22) return "🌙 Bonne soirée !";
      return "🌙 Douce nuit !";
    }

    document.getElementById('salutation').innerText = getSalutation();

    function toggle(s) {
      ['voeux', 'contrat', 'semaine'].forEach(x => {
        document.getElementById('panel-' + x).style.display = 'none';
        document.getElementById('btn-' + x).classList.remove('active');
      });
      if (actif !== s) {
        document.getElementById('panel-' + s).style.display = 'block';
        document.getElementById('btn-' + s).classList.add('active');
        actif = s;
      } else { actif = null; }
    }

    function envoyer(s) {
      let payload = { 
        type: s, 
        nom: document.getElementById('nom-'+s).value,
        telephone: document.getElementById('tel-'+s).value,
        message: document.getElementById('msg-'+s).value
      };

      if (!payload.nom) { alert("Nom requis"); return; }
      
      // Envoi asynchrone
      fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
      
      // Redirection Flash
      window.location.href = 'merci.html';
    }
  </script>
</body>
</html>
